<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Derigs · admin</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Admin view of the ATP250 derig game: who played, results per round, best per player. Same ink/hi-vis look as the game. */
:root{--ink:#141B23;--ink2:#2C3743;--paper:#E8ECEF;--hivis:#FF7A1A;--muted:#5D6976;--line:#D3D9DF;--card:#fff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#141B23;--ink:#E8ECEF;--card:#1c252f;--line:#2C3743;--muted:#9AA6B2;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 var(--mono)}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--hivis)}
h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:15px var(--mono);padding:9px 10px;border:2px solid var(--ink);border-radius:3px;background:var(--card);color:var(--ink);min-width:0;flex:1;max-width:420px}
button{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;background:var(--hivis);color:#141B23;border:0;border-radius:3px;padding:9px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.err{color:#C0362C}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.stats b{display:block;font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n{text-align:right}
tr.round td{background:color-mix(in srgb,var(--hivis) 10%,var(--card));font-weight:600}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
.win{color:#1F8A50;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div>
    <div class="eyebrow">pts24.lv · ATP250 kabeļu derigs</div>
    <h1>Spēles <em>admin</em></h1>
  </div>

  <form id="login" class="row" hidden>
    <input id="key" type="password" autocomplete="current-password" placeholder="Admin atslēga" aria-label="Admin atslēga">
    <button>Ielogoties</button>
    <p class="err" id="err" hidden></p>
  </form>

  <section id="data" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <span class="eyebrow" id="updated"></span>
      <span class="row"><button class="ghost" id="reload">Atjaunot</button><button class="ghost" id="logout">Iziet</button></span>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="playersSec" hidden>
    <h2>Spēlētāji</h2>
    <div class="wrap"><table><thead><tr><th>Vārds</th><th class="n">Spēles</th><th class="n">Labākais</th><th class="n">Vidēji</th><th class="n">Kabeļi kopā</th><th>Pirmoreiz</th><th>Pēdējoreiz</th></tr></thead><tbody id="players"></tbody></table></div>
  </section>

  <section id="playsSec" hidden>
    <h2>Spēles</h2>
    <div class="wrap"><table><thead><tr><th>Laiks</th><th>Režīms</th><th>Vārds</th><th class="n">Punkti</th><th class="n">Kabeļi</th><th>Piezīmes</th></tr></thead><tbody id="plays"></tbody></table></div>
  </section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const API=new URLSearchParams(location.search).get('api')||(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://localhost:8787':'https://game.pts24.lv');
const MODE={race:'Sacensība',team:'Komanda',solo:'Viens'};
const dt=ms=>new Date(ms).toLocaleString('lv-LV',{timeZone:'Europe/Riga',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const el=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e;};
const tr=(cells,cls)=>{const r=el('tr',null,cls);cells.forEach(([t,c])=>r.append(el('td',t,c)));return r;};
let key='';try{key=localStorage.getItem('atp250-admin-key')||'';}catch(e){}

async function load(){
  $('err').hidden=true;
  let res;
  try{res=await fetch(API+'/admin',{headers:{Authorization:'Bearer '+key}});}
  catch(e){return fail('Serveris neatbild. Pārbaudi internetu.');}
  if(res.status===401)return fail(key?'Atslēga nav pareiza.':'');
  if(!res.ok)return fail('Kļūda: '+res.status);
  try{localStorage.setItem('atp250-admin-key',key);}catch(e){}
  show(await res.json());
}
function fail(msg){$('login').hidden=false;['data','playersSec','playsSec'].forEach(id=>$(id).hidden=true);if(msg){$('err').textContent=msg;$('err').hidden=false;}$('key').focus();}

function show(d){
  $('login').hidden=true;['data','playersSec','playsSec'].forEach(id=>$(id).hidden=false);
  $('updated').textContent='Atjaunots '+dt(d.now);
  const rounds=new Set(d.plays.filter(p=>p.round).map(p=>p.round)).size,leader=d.top[0];
  $('stats').replaceChildren(...[[d.players.length,'Spēlētāji'],[d.plays.length,'Rezultāti'],[rounds,'Raundi istabā'],[leader?leader.score:'–',leader?'Līderis: '+leader.name:'Līderis']]
    .map(([b,s])=>{const x=el('div');x.append(el('b',String(b)),el('span',s));return x;}));
  $('players').replaceChildren(...d.players.map(p=>tr([[p.name],[p.games,'n'],[p.best,'n'],[p.avg,'n'],[p.cables,'n'],[dt(p.first)],[dt(p.last)]])));
  // newest first; a room round gets a header line with the team result
  const rows=[];let cur=null;
  for(const p of d.plays){
    const grp=p.round?'r'+p.round+'-'+p.at:'s'+p.id;
    if(p.round&&grp!==cur){cur=grp;
      const team=p.team_cables!=null?` · komanda ${p.team_cables}/8${p.team_win?' · pabeigts':''}`:'';
      rows.push(tr([[dt(p.at)],[MODE[p.mode]||p.mode],[`Raunds #${p.round}${team}`],[''],[''],['']],'round'));}
    const note=[p.left_early?'izgāja':'',p.mode==='solo'&&p.cables===8?'viss satīts':''].filter(Boolean).join(', ');
    rows.push(tr([[p.round?'':dt(p.at)],[p.round?'':MODE[p.mode]||p.mode],[p.name],[p.score,'n'],[p.cables,'n'],[note]]));
  }
  $('plays').replaceChildren(...rows);
}

$('login').onsubmit=e=>{e.preventDefault();key=$('key').value.trim();load();};
$('reload').onclick=load;
$('logout').onclick=()=>{key='';try{localStorage.removeItem('atp250-admin-key');}catch(e){}fail('');};
if(key)load();else fail('');
})();
</script>
</body>
</html>
