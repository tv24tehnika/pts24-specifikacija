<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Kameras FOV Kalkulators</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full p-6 bg-white rounded-lg shadow-md border border-gray-200 font-sans">
        <h2 class="text-xl font-bold text-gray-800 mb-2">
            Kameras FOV Kalkulators
        </h2>
        <p class="text-sm text-gray-500 mb-6">
            Standarta 2/3" sensors
        </p>

        <div class="space-y-6">
            <!-- Objektīva izvēle -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Izvēlies objektīvu
                </label>
                <select id="lensSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="ua14">Fujinon UA14x4.5BERD-S10B (4.5-63mm)</option>
                    <option value="ua46">Fujinon UA46X9.5BERD-U1 (9.5-437mm)</option>
                    <option value="ua22">Fujinon UA22x8BERD-S8 (8-176mm)</option>
                    <option value="ha27">Fujinon HA27x6.5BESM-F48B box (6.5-180mm)</option>
                    <option value="xa76">Fujinon XA76x9.3BESM box (9.3-710mm)</option>
                    <option value="xa101">Fujinon XA101x8.9BESM box (8.9-900mm)</option>
                    <option value="c86">Canon XJ86x9.3B DIGISUPER 86AF (9.3-800mm)</option>
                    <option value="cj15">Canon J15ax8B4 IAS Sx12 (8-120mm)</option>
                    <option value="custom">Cits objektīvs (ievadīt manuāli)</option>
                </select>
                <div id="customLens" class="hidden grid grid-cols-3 gap-3 mt-3">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Wide (mm)</label>
                        <input type="number" id="customMin" min="0.1" step="0.1" value="8"
                            class="w-full px-2 py-2 border border-gray-300 rounded-md text-right focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Tele (mm)</label>
                        <input type="number" id="customMax" min="0.1" step="0.1" value="120"
                            class="w-full px-2 py-2 border border-gray-300 rounded-md text-right focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Ekstenders</label>
                        <select id="customExt" class="w-full px-2 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="1">Nav</option>
                            <option value="1.5">1.5x</option>
                            <option value="2" selected>2x</option>
                        </select>
                    </div>
                    <p id="customError" class="hidden col-span-3 text-xs text-red-600">
                        Tele jābūt lielākam par Wide, abiem — lielākiem par 0.
                    </p>
                </div>
                <label id="extenderLabel" class="flex items-center mt-3 text-sm text-gray-700">
                    <input type="checkbox" id="extenderToggle" class="mr-2 h-4 w-4 accent-blue-600" />
                    <span id="extenderName">2x ekstenders</span>
                    <span id="extenderRange" class="ml-2 text-xs text-gray-500"></span>
                </label>
            </div>

            <!-- Distances ievade -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Distance līdz skatuvei
                </label>
                <div class="flex items-center space-x-4">
                    <input
                        type="range"
                        id="distanceSlider"
                        min="1"
                        max="150"
                        step="0.5"
                        value="40"
                        class="w-2/3"
                    />
                    <div class="w-1/3 flex items-center border border-gray-300 rounded-md px-2 bg-white">
                        <input
                            type="number"
                            id="distanceInput"
                            min="1"
                            value="40"
                            class="w-full py-2 text-right focus:outline-none"
                        />
                        <span class="ml-2 text-sm text-gray-500">m</span>
                    </div>
                </div>
            </div>

            <!-- Fokusa attāluma ievade -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Fokusa attālums (Zoom)
                </label>
                <div class="flex items-center space-x-4">
                    <input
                        type="range"
                        id="focalSlider"
                        min="4.5"
                        max="63"
                        step="0.1"
                        value="4.5"
                        class="w-2/3"
                    />
                    <div class="w-1/3 flex items-center border border-gray-300 rounded-md px-2 bg-white">
                        <input
                            type="number"
                            id="focalInput"
                            min="4.5"
                            max="63"
                            step="0.1"
                            value="4.5"
                            class="w-full py-2 text-right focus:outline-none"
                        />
                        <span class="ml-2 text-sm text-gray-500">mm</span>
                    </div>
                </div>
                <div class="flex justify-between text-xs text-gray-500 mt-1 w-2/3">
                    <span id="wideLabel">Wide (4.5)</span>
                    <span id="teleLabel">Tele (63)</span>
                </div>
            </div>

            <!-- Rezultātu izvade -->
            <div class="bg-blue-50 p-4 rounded-md mt-6">
                <h3 class="text-sm font-semibold text-blue-900 mb-2">
                    Redzamais skatuves laukums:
                </h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-xs text-blue-700 uppercase">Platums</p>
                        <p class="text-2xl font-bold text-blue-900"><span id="widthResult">0.00</span> m</p>
                    </div>
                    <div>
                        <p class="text-xs text-blue-700 uppercase">Augstums</p>
                        <p class="text-2xl font-bold text-blue-900"><span id="heightResult">0.00</span> m</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Standarta 2/3" sensora izmēri (16:9 formātam)
        const sensorWidth = 9.6;
        const sensorHeight = 5.4;

        // Objektīvu datubāze
        const lensData = {
            ua14: { min: 4.5, max: 63, ext: 2 },
            ua46: { min: 9.5, max: 437, ext: 2 },
            ua22: { min: 8, max: 176, ext: 2 },
            ha27: { min: 6.5, max: 180, ext: 2 },
            xa76: { min: 9.3, max: 710, ext: 2 },
            xa101: { min: 8.9, max: 900, ext: 2 },
            c86: { min: 9.3, max: 800, ext: 2 },
            cj15: { min: 8, max: 120, ext: 2 },
            // Manuāli ievadīts objektīvs — vērtības pārraksta customLens lauki
            custom: { min: 8, max: 120, ext: 2 }
        };

        // Elementu piesaiste
        const lensSelect = document.getElementById('lensSelect');
        const extenderToggle = document.getElementById('extenderToggle');
        const extenderLabel = document.getElementById('extenderLabel');
        const extenderName = document.getElementById('extenderName');
        const extenderRange = document.getElementById('extenderRange');

        const customLens = document.getElementById('customLens');
        const customMin = document.getElementById('customMin');
        const customMax = document.getElementById('customMax');
        const customExt = document.getElementById('customExt');
        const customError = document.getElementById('customError');

        const distanceInput = document.getElementById('distanceInput');
        const distanceSlider = document.getElementById('distanceSlider');
        
        const focalInput = document.getElementById('focalInput');
        const focalSlider = document.getElementById('focalSlider');
        
        const wideLabel = document.getElementById('wideLabel');
        const teleLabel = document.getElementById('teleLabel');
        
        const widthResult = document.getElementById('widthResult');
        const heightResult = document.getElementById('heightResult');

        // Efektīvais fokusa diapazons — ar vai bez ekstendera
        function getRange() {
            const lens = lensData[lensSelect.value];
            const factor = extenderToggle.checked ? extFactor(lens) : 1;
            return {
                min: Math.round(lens.min * factor * 10) / 10,
                max: Math.round(lens.max * factor * 10) / 10
            };
        }

        // Uzliek diapazonu slaiderim un ievadei, noapaļojot vērtību tā robežās
        function applyRange(focal) {
            const range = getRange();

            focalInput.min = range.min;
            focalInput.max = range.max;
            focalSlider.min = range.min;
            focalSlider.max = range.max;

            const val = Math.min(range.max, Math.max(range.min, focal));
            focalInput.value = val;
            focalSlider.value = val;

            // Atjaunina tekstus zem slaidera
            wideLabel.textContent = `Wide (${range.min})`;
            teleLabel.textContent = `Tele (${range.max})`;

            calculateAndDisplay();
        }

        // Ekstendera reizinātājs; 1 vai bez lauka = objektīvam ekstendera nav
        function extFactor(lens) {
            return lens.ext > 1 ? lens.ext : 1;
        }

        // Ekstendera rūtiņa pieejama tikai tiem objektīviem, kuriem ekstenderis ir
        function updateExtenderUI() {
            const lens = lensData[lensSelect.value];
            const factor = extFactor(lens);
            const hasExtender = factor > 1;

            if (!hasExtender) extenderToggle.checked = false;
            extenderToggle.disabled = !hasExtender;
            extenderLabel.classList.toggle('text-gray-400', !hasExtender);
            extenderLabel.classList.toggle('text-gray-700', hasExtender);

            if (hasExtender) {
                extenderName.textContent = `${factor}x ekstenders`;
                const min = Math.round(lens.min * factor * 10) / 10;
                const max = Math.round(lens.max * factor * 10) / 10;
                extenderRange.textContent = `(${min}-${max}mm)`;
            } else {
                extenderName.textContent = 'Ekstenderis nav pieejams';
                extenderRange.textContent = '';
            }
        }

        // Objektīva nomaiņas loģika — pārslēdzoties uzliek platāko leņķi kā noklusējumu
        function handleLensChange() {
            customLens.classList.toggle('hidden', lensSelect.value !== 'custom');
            updateExtenderUI();
            applyRange(getRange().min);
        }

        // Manuālā objektīva dati — nederīgu ievadi neņem vērā, paturot pēdējās derīgās vērtības
        function handleCustomChange() {
            const min = parseFloat(customMin.value);
            const max = parseFloat(customMax.value);
            const valid = min > 0 && max > min;

            customError.classList.toggle('hidden', valid);
            if (!valid) return;

            lensData.custom = { min, max, ext: parseFloat(customExt.value) };
            updateExtenderUI();
            applyRange(parseFloat(focalInput.value) || min);
        }

        // Ekstenderis maina fokusa attālumu tajā pašā zoom pozīcijā
        function handleExtenderChange() {
            const factor = extFactor(lensData[lensSelect.value]);
            const current = parseFloat(focalInput.value) || 0;
            applyRange(extenderToggle.checked ? current * factor : current / factor);
        }

        function handleDistanceChange(e) {
            const val = e.target.value;
            distanceInput.value = val;
            distanceSlider.value = val;
            calculateAndDisplay();
        }

        function handleFocalChange(e) {
            let val = parseFloat(e.target.value);
            const range = getRange();

            // Neļauj iziet ārpus objektīva fokusa diapazona
            if (isNaN(val) || val <= 0) val = range.min;
            if (val > range.max) val = range.max;

            focalInput.value = val;
            focalSlider.value = val;
            calculateAndDisplay();
        }

        function calculateAndDisplay() {
            const distance = parseFloat(distanceInput.value) || 0;
            const focalLength = parseFloat(focalInput.value) || 0;

            if (distance > 0 && focalLength > 0) {
                const fovWidth = (sensorWidth * distance) / focalLength;
                const fovHeight = (sensorHeight * distance) / focalLength;

                widthResult.textContent = fovWidth.toFixed(2);
                heightResult.textContent = fovHeight.toFixed(2);
            } else {
                widthResult.textContent = "0.00";
                heightResult.textContent = "0.00";
            }
        }

        // Event listeneri
        lensSelect.addEventListener('change', handleLensChange);
        extenderToggle.addEventListener('change', handleExtenderChange);

        customMin.addEventListener('input', handleCustomChange);
        customMax.addEventListener('input', handleCustomChange);
        customExt.addEventListener('change', handleCustomChange);

        distanceInput.addEventListener('input', handleDistanceChange);
        distanceSlider.addEventListener('input', handleDistanceChange);
        
        focalInput.addEventListener('input', handleFocalChange);
        focalSlider.addEventListener('input', handleFocalChange);

        // Sākotnējais aprēķins (pārlūks pēc pārlādes var atjaunot iepriekšējo izvēli)
        customLens.classList.toggle('hidden', lensSelect.value !== 'custom');
        handleCustomChange();
        updateExtenderUI();
        applyRange(parseFloat(focalInput.value));
    </script>
</body>
</html>
